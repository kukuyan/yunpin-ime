name: CI

on:
  push:
    branches: [main, "codex/**"]
    tags: ["v*-preview.*"]
  pull_request:

permissions:
  contents: read

jobs:
  privacy-and-license:
    name: privacy-and-license
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: bash scripts/check_private_data.sh
      - run: python3 scripts/check_licenses.py
      - run: python3 scripts/check_supply_chain.py
      - run: python3 scripts/check_release_workflow.py
      - run: python3 scripts/check_release_sbom.py
      - run: python3 -m unittest discover -s tests -p "test_release_*.py" -v
      - run: ruby scripts/check_yaml.rb
      - run: docker compose config --quiet
      - run: python3 scripts/check_submodule_locks.py

  engine:
    name: engine-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: make -C engine test benchmark
      - run: make -C mobile test

  engine-windows:
    name: engine-windows
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: cmake -S engine -B build/engine -A x64
      - run: cmake --build build/engine --config Release --parallel
      - run: ctest --test-dir build/engine -C Release --output-on-failure

  windows-client:
    name: windows-client
    # The build is locked to Visual Studio 2022's v143 toolset. Do not move
    # this job to windows-2025/VS 2026 without validating side-by-side v143.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: desktopagent/go.mod
          cache-dependency-path: |
            desktopagent/go.sum
            syncclient/go.sum
            localstore/go.sum
            protocol/go.sum
      - name: Initialize pinned Windows sources
        shell: pwsh
        run: |
          git submodule update --init third_party/weasel third_party/librime third_party/rime-ice
          if ($LASTEXITCODE -ne 0) { throw "top-level submodule initialization failed" }
          git -C third_party/librime submodule update --init --recursive
          if ($LASTEXITCODE -ne 0) { throw "librime dependency initialization failed" }
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            build/windows/cache
            build/windows/deps
          key: windows-client-${{ hashFiles('platform/windows/dependencies.lock.json') }}
      - name: Verify Windows integration source
        run: python -m unittest discover -s platform/windows/tests -p "test_*.py" -v
      - name: Verify installer UTF-8 opt-in preservation
        shell: pwsh
        run: .\platform\windows\tests\Test-Install-Preview-Utf8.ps1
      - name: Verify private snapshot E2E gate recovery fixtures
        shell: pwsh
        run: .\platform\windows\e2e\Test-Private-Snapshot-E2E.ps1
      - name: Build portable plugin tests with MSVC
        run: cmake -S librime-yunpin -B build/librime-yunpin-windows -A x64
      - run: cmake --build build/librime-yunpin-windows --config Release --parallel
      - run: ctest --test-dir build/librime-yunpin-windows -C Release --output-on-failure
      - name: Build and package merged Weasel preview
        shell: pwsh
        run: .\platform\windows\scripts\Build-Preview.ps1
      - name: Verify private Windows E2E artifact identity
        shell: pwsh
        run: |
          $root = "build/windows/e2e-private/windows"
          $metadata = Get-Content -LiteralPath (Join-Path $root "BUILD-METADATA.json") -Raw | ConvertFrom-Json
          $publicOverlaySha = (Get-FileHash -Algorithm SHA256 -LiteralPath `
            "platform/windows/rime/rime_ice.custom.yaml").Hash.ToLowerInvariant()
          if ($metadata.schemaVersion -ne 2 -or
              $metadata.repositoryCommit -cne $env:GITHUB_SHA -or
              $metadata.buildTag -cne "yunpin_pairing_private" -or
              $metadata.activationGate -cne "private-snapshot-e2e-only" -or
              $metadata.sameRunPublicOverlay.relativePath -cne "platform/windows/rime/rime_ice.custom.yaml" -or
              $metadata.sameRunPublicOverlay.sha256 -cne $publicOverlaySha -or
              $metadata.overlayOnly -ne $true -or
              $metadata.requiredHostCapability -cne "yunpin_learning_allowed" -or
              $metadata.hostCapabilityProvided -ne $false -or
              $metadata.realCandidateVisibilityClaimed -ne $false -or
              $metadata.publicReleaseEligible -ne $false) {
            throw "Windows private E2E artifact identity or release boundary differs"
          }
          $checksumPaths = @()
          if (-not (Test-Path -LiteralPath (Join-Path $root ".yunpin-private-e2e-generated") -PathType Leaf)) {
            throw "Windows private E2E generated-output marker is missing"
          }
          foreach ($line in Get-Content -LiteralPath (Join-Path $root "SHA256SUMS")) {
            if ($line -notmatch '^([0-9a-f]{64})  (\.yunpin-private-e2e-generated|BUILD-METADATA\.json|yunpin-sync-agent\.exe|Private-Snapshot-E2E\.Common\.ps1|Enable-Private-Snapshot-E2E\.ps1|Disable-Private-Snapshot-E2E\.ps1|README\.md|licenses/[A-Za-z0-9_.@-]+)$') { throw "Malformed Windows E2E checksum row" }
            $checksumPaths += $Matches[2]
            $observed = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $root $Matches[2])).Hash.ToLowerInvariant()
            if ($observed -cne $Matches[1]) { throw "Windows E2E artifact checksum mismatch" }
          }
          if ($checksumPaths -notcontains ".yunpin-private-e2e-generated" -or
              $checksumPaths -notcontains "BUILD-METADATA.json" -or
              $checksumPaths -notcontains "yunpin-sync-agent.exe" -or
              $checksumPaths -notcontains "licenses/LICENSES.json" -or
              $checksumPaths -notcontains "Private-Snapshot-E2E.Common.ps1" -or
              $checksumPaths -notcontains "Enable-Private-Snapshot-E2E.ps1" -or
              $checksumPaths -notcontains "Disable-Private-Snapshot-E2E.ps1" -or
              $checksumPaths -notcontains "README.md" -or
              (@($checksumPaths | Select-Object -Unique).Count -ne $checksumPaths.Count)) {
            throw "Windows E2E checksum coverage differs"
          }
          $prefix = ([IO.Path]::GetFullPath($root)).TrimEnd("\") + "\"
          $actualPaths = @(Get-ChildItem -LiteralPath $root -File -Recurse | Where-Object {
            $_.Name -cne "SHA256SUMS"
          } | ForEach-Object {
            $_.FullName.Substring($prefix.Length).Replace("\", "/")
          })
          if ($actualPaths.Count -ne $checksumPaths.Count -or
              @($actualPaths | Where-Object { $checksumPaths -cnotcontains $_ }).Count -ne 0) {
            throw "Windows E2E SHA256SUMS does not cover the complete private artifact"
          }
      - name: Bind Windows release metadata to tag commit
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $runtime = "build/windows/artifacts/YunPin-IME-Windows-development-preview.zip"
          $source = "build/windows/artifacts/YunPin-IME-Windows-development-preview-source.zip"
          python scripts/verify_release_assets.py verify-windows-commit `
            --commit $env:GITHUB_SHA $runtime $source
          if ($LASTEXITCODE -ne 0) { throw "Windows archive metadata verification failed" }
          python scripts/verify_release_assets.py write-job-metadata `
            --platform windows --tag $env:GITHUB_REF_NAME --commit $env:GITHUB_SHA `
            --output build/windows/artifacts/windows-release-metadata.json `
            $runtime $source
          if ($LASTEXITCODE -ne 0) { throw "Windows release metadata generation failed" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: YunPin-Windows-development-preview
          path: |
            build/windows/artifacts/YunPin-IME-Windows-development-preview.zip
            build/windows/artifacts/YunPin-IME-Windows-development-preview-source.zip
            build/windows/artifacts/SHA256SUMS
            build/windows/artifacts/windows-release-metadata.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload private Windows E2E bundle only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: YunPin-Windows-private-pairing-E2E
          path: build/windows/e2e-private/windows
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  importer:
    name: importer-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -p "test_*.py" -v
        working-directory: tools/importer
      - run: python -m unittest discover -s tests -p "test_*.py" -v
        working-directory: tools/public_pack

  sync:
    name: sync
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: sync/go.mod
          cache-dependency-path: sync/go.sum
      - run: go mod verify
        working-directory: sync
      - run: go vet ./...
        working-directory: sync
      - run: go test -race ./...
        working-directory: sync
      - run: docker build --target test -t yunpin-sync:test ./sync
      - run: docker build --target test -f integration/Dockerfile -t yunpin-integration:test .
      - run: docker build --target runtime -t yunpin-sync:runtime ./sync
      - run: sh sync/scripts/smoke-container.sh yunpin-sync:runtime

  syncclient:
    name: syncclient
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: syncclient/go.mod
          cache-dependency-path: |
            syncclient/go.sum
            localstore/go.sum
            protocol/go.sum
      - run: go mod verify
        working-directory: syncclient
      - run: go vet ./...
        working-directory: syncclient
      - run: go test -race ./...
        working-directory: syncclient

  desktopagent:
    name: desktopagent-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: desktopagent/go.mod
          cache-dependency-path: |
            desktopagent/go.sum
            syncclient/go.sum
            localstore/go.sum
            protocol/go.sum
      - run: go mod verify
        working-directory: desktopagent
      - run: go vet ./...
        working-directory: desktopagent
      - run: go test ./...
        if: runner.os == 'Windows'
        working-directory: desktopagent
      - run: go test -race ./...
        if: runner.os != 'Windows'
        working-directory: desktopagent
      - run: go test -tags yunpin_pairing_private ./...
        working-directory: desktopagent

  protocol:
    name: protocol
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: protocol/go.mod
          cache-dependency-path: protocol/go.sum
      - run: go mod verify
        working-directory: protocol
      - run: go vet ./...
        working-directory: protocol
      - run: go test -race ./...
        working-directory: protocol

  localstore:
    name: localstore
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: localstore/go.mod
          cache-dependency-path: |
            localstore/go.sum
            protocol/go.sum
      - run: go mod verify
        working-directory: localstore
      - run: go vet ./...
        working-directory: localstore
      - run: go test -race ./...
        working-directory: localstore

  replaylab:
    name: replaylab-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: replaylab/go.mod
          cache: false
      - run: go mod verify
        working-directory: replaylab
      - run: go vet ./...
        working-directory: replaylab
      - run: go test ./...
        if: runner.os == 'Windows'
        working-directory: replaylab
      - run: go test -race ./...
        if: runner.os != 'Windows'
        working-directory: replaylab

  macos-client:
    name: macos-client
    # Keep the host OS and the Xcode 26 asset toolchain on the same runner
    # generation. Mixing Xcode 26 with macOS 15 crashes AssetCatalogAgent.
    runs-on: macos-26
    env:
      YUNPIN_MACOS_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: desktopagent/go.mod
          cache-dependency-path: |
            desktopagent/go.sum
            syncclient/go.sum
            localstore/go.sum
            protocol/go.sum
      - run: sudo xcode-select --switch /Applications/Xcode_26.4.1.app
      - run: xcodebuild -version
      - run: cmake --version
      - run: make -C platform/macos test
      - run: make -C platform/macos dmg BUILD_ROOT=build/macos
      - name: Verify private macOS E2E artifact identity
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("build/macos/e2e-private/macos")
          metadata = json.loads((root / "BUILD-METADATA.json").read_text(encoding="utf-8"))
          if metadata.get("repositoryCommit") != os.environ["GITHUB_SHA"]:
              raise SystemExit("macOS private E2E artifact commit differs")
          if metadata.get("buildTag") != "yunpin_pairing_private":
              raise SystemExit("macOS private E2E artifact build tag differs")
          if metadata.get("publicReleaseEligible") is not False:
              raise SystemExit("macOS private E2E artifact became release eligible")
          PY
          (cd build/macos/e2e-private/macos && shasum -a 256 -c SHA256SUMS)
      - name: Bind macOS release metadata to tag commit
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          hdiutil verify build/macos/package/YunPin-IME-macOS-development-preview.dmg
          python3 scripts/verify_release_assets.py write-job-metadata \
            --platform macos --tag "${GITHUB_REF_NAME}" --commit "${GITHUB_SHA}" \
            --output build/macos/package/macos-release-metadata.json \
            build/macos/package/YunPin-IME-macOS-development-preview.dmg \
            build/macos/package/YunPin-IME-development-preview-source.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: YunPin-macOS-development-preview
          path: |
            build/macos/package/YunPin-IME-macOS-development-preview.dmg
            build/macos/package/YunPin-IME-development-preview-source.tar.gz
            build/macos/package/macos-release-metadata.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload private-pairing macOS E2E agent only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: YunPin-macOS-private-pairing-E2E
          path: build/macos/e2e-private/macos
          if-no-files-found: error
          retention-days: 1

  required:
    name: required
    if: always()
    needs: [privacy-and-license, engine, engine-windows, windows-client, importer, localstore, replaylab, protocol, sync, syncclient, desktopagent, macos-client]
    runs-on: ubuntu-24.04
    steps:
      - name: Verify required jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: test "$RESULTS" = "success success success success success success success success success success success success"

  release-preview:
    name: release-preview
    if: startsWith(github.ref, 'refs/tags/')
    needs: [required, windows-client, macos-client]
    permissions:
      actions: read
      attestations: read
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      release_tag: ${{ github.ref_name }}
      release_commit: ${{ github.sha }}
