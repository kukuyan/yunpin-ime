name: Publish Unsigned Preview

on:
  workflow_call:
    inputs:
      release_tag:
        description: "Immutable vX.Y.Z-preview.N tag"
        required: true
        type: string
      release_commit:
        description: "Exact full-CI commit"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: yunpin-preview-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  release:
    name: publish-preview-release
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      attestations: read
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      EXPECTED_SHA: ${{ inputs.release_commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify full-CI release identity
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-preview\.[0-9]+$ ]]; then
            echo "release tag must match vX.Y.Z-preview.N" >&2
            exit 1
          fi
          [[ "${EXPECTED_SHA}" =~ ^[0-9a-f]{40}$ ]] || exit 1
          test "${GITHUB_REF}" = "refs/tags/${RELEASE_TAG}"
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          test "$(git rev-list -n 1 "${RELEASE_TAG}")" = "${EXPECTED_SHA}"
          python3 scripts/check_release_workflow.py
      - name: Download same-run Windows and macOS artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/release-download/windows build/release-download/macos
          gh run download "${GITHUB_RUN_ID}" \
            --name YunPin-Windows-development-preview \
            --dir build/release-download/windows
          gh run download "${GITHUB_RUN_ID}" \
            --name YunPin-macOS-development-preview \
            --dir build/release-download/macos
      - name: Generate and verify immutable SPDX release SBOM
        run: |
          set -euo pipefail
          mkdir -p build/release-sbom
          sbom="build/release-sbom/YunPin-IME-${RELEASE_TAG}.spdx.json"
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "${EXPECTED_SHA}")"
          python3 scripts/generate_release_sbom.py \
            --tag "${RELEASE_TAG}" \
            --commit "${EXPECTED_SHA}" \
            --output "${sbom}"
          python3 scripts/check_release_sbom.py \
            --tag "${RELEASE_TAG}" --commit "${EXPECTED_SHA}" "${sbom}"
      - name: Verify and assemble exact release assets
        run: |
          set -euo pipefail
          python3 scripts/verify_release_assets.py finalize \
            --tag "${RELEASE_TAG}" \
            --commit "${EXPECTED_SHA}" \
            --windows-dir build/release-download/windows \
            --macos-dir build/release-download/macos \
            --sbom "build/release-sbom/YunPin-IME-${RELEASE_TAG}.spdx.json" \
            --output-dir build/release-dist
      - name: Recheck immutable remote tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags --force origin \
            "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          remote_sha="$(git rev-list -n 1 "${RELEASE_TAG}")"
          test "${remote_sha}" = "${EXPECTED_SHA}"
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "a GitHub Release already exists for ${RELEASE_TAG}" >&2
            exit 1
          fi
      - name: Publish complete unsigned prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          create_attempted=false
          release_id=""
          release_version="${RELEASE_TAG#v}"
          release_title="YunPin IME ${release_version} (unsigned preview)"
          draft_owner="yunpin-release-run:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:$(python3 -c 'import secrets; print(secrets.token_hex(16))')"
          draft_title="${release_title} [draft ${draft_owner}]"
          draft_marker="<!-- ${draft_owner} -->"
          owned_notes="$(mktemp "${RUNNER_TEMP:?}/yunpin-release-notes.XXXXXX")"
          release_list="$(mktemp "${RUNNER_TEMP:?}/yunpin-release-list.XXXXXX")"
          release_identity="$(mktemp "${RUNNER_TEMP:?}/yunpin-release-identity.XXXXXX")"
          published_identity="$(mktemp "${RUNNER_TEMP:?}/yunpin-published-identity.XXXXXX")"
          readonly draft_resolve_attempts=6
          readonly draft_resolve_initial_delay=1
          readonly draft_resolve_max_delay=8
          cp build/release-dist/RELEASE-NOTES.md "${owned_notes}"
          printf '\n%s\n' "${draft_marker}" >>"${owned_notes}"

          fetch_authenticated_releases() {
            output=$1
            gh api -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/releases?per_page=100" >"${output}"
          }

          resolve_owned_draft_with_retry() {
            local output=$1
            local attempt=1
            local delay=${draft_resolve_initial_delay}
            local candidate=""
            local resolution_status=0
            local resolver_error="${output}.resolve-error"
            while (( attempt <= draft_resolve_attempts )); do
              : >"${resolver_error}"
              if fetch_authenticated_releases "${output}"; then
                if candidate="$(python3 scripts/check_release_workflow.py resolve-draft \
                  --response "${output}" \
                  --tag "${RELEASE_TAG}" \
                  --title "${draft_title}" \
                  --owner-marker "${draft_marker}" 2>"${resolver_error}")"; then
                  if [[ "${candidate}" =~ ^[0-9]+$ ]]; then
                    rm -f "${resolver_error}"
                    printf '%s\n' "${candidate}"
                    return 0
                  fi
                  printf '%s\n' "draft resolver returned a non-numeric ID" \
                    >"${resolver_error}"
                  resolution_status=1
                else
                  resolution_status=$?
                fi
              else
                resolution_status=2
                printf '%s\n' "authenticated release list request failed" \
                  >"${resolver_error}"
              fi

              # Only an absent draft (resolver status 2) or a transient list
              # request failure is retryable. Ambiguity, invalid JSON, marker
              # mismatch, and invalid IDs remain terminal and fail closed.
              if [[ ${resolution_status} -ne 2 ]]; then
                cat "${resolver_error}" >&2
                rm -f "${resolver_error}"
                return 1
              fi
              if (( attempt == draft_resolve_attempts )); then
                cat "${resolver_error}" >&2
                printf 'run-owned draft remained invisible after %s attempts\n' \
                  "${draft_resolve_attempts}" >&2
                rm -f "${resolver_error}"
                return 1
              fi

              printf 'run-owned draft not visible; retry %s/%s in %ss\n' \
                "${attempt}" "${draft_resolve_attempts}" "${delay}" >&2
              sleep "${delay}"
              delay=$((delay * 2))
              if (( delay > draft_resolve_max_delay )); then
                delay=${draft_resolve_max_delay}
              fi
              attempt=$((attempt + 1))
            done
            return 1
          }

          cleanup_failed_draft() {
            status=$?
            trap - EXIT
            if [[ ${status} -ne 0 && "${create_attempted}" == true ]]; then
              cleanup_list="$(mktemp "${RUNNER_TEMP:?}/yunpin-release-cleanup-list.XXXXXX")"
              cleanup_identity="$(mktemp "${RUNNER_TEMP:?}/yunpin-release-cleanup-identity.XXXXXX")"
              cleanup_release_id=""
              if cleanup_release_id="$(resolve_owned_draft_with_retry \
                "${cleanup_list}")" \
                && [[ "${cleanup_release_id}" =~ ^[0-9]+$ ]]; then
                  if gh api -H "Accept: application/vnd.github+json" \
                    -H "X-GitHub-Api-Version: 2026-03-10" \
                    "repos/${GITHUB_REPOSITORY}/releases/${cleanup_release_id}" \
                    >"${cleanup_identity}" \
                    && python3 scripts/check_release_workflow.py verify-draft \
                      --response "${cleanup_identity}" \
                      --tag "${RELEASE_TAG}" \
                      --title "${draft_title}" \
                      --owner-marker "${draft_marker}" \
                      --id "${cleanup_release_id}" >/dev/null; then
                    gh api --method DELETE \
                      "repos/${GITHUB_REPOSITORY}/releases/${cleanup_release_id}" \
                      >/dev/null || true
                  fi
              fi
              rm -f "${cleanup_list}" "${cleanup_identity}"
            fi
            rm -f "${owned_notes}" "${release_list}" "${release_identity}" \
              "${published_identity}"
            exit "${status}"
          }
          trap cleanup_failed_draft EXIT

          create_attempted=true
          gh release create "${RELEASE_TAG}" --draft --prerelease --verify-tag \
            --title "${draft_title}" --notes-file "${owned_notes}"
          release_id="$(resolve_owned_draft_with_retry "${release_list}")"
          [[ "${release_id}" =~ ^[0-9]+$ ]]
          gh api -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            >"${release_identity}"
          python3 scripts/check_release_workflow.py verify-draft \
            --response "${release_identity}" \
            --tag "${RELEASE_TAG}" \
            --title "${draft_title}" \
            --owner-marker "${draft_marker}" \
            --id "${release_id}" >/dev/null

          assets=()
          while IFS= read -r asset; do
            assets+=("${asset}")
          done < <(find build/release-dist -maxdepth 1 -type f \
            ! -name RELEASE-NOTES.md -print | sort)
          test "${#assets[@]}" -eq 8
          for asset in "${assets[@]}"; do
            asset_name="$(basename "${asset}")"
            encoded_name="$(python3 -c \
              'import sys; from urllib.parse import quote; print(quote(sys.argv[1], safe=""))' \
              "${asset_name}")"
            gh api --method POST \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              -H "Content-Type: application/octet-stream" \
              --input "${asset}" \
              "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?name=${encoded_name}" \
              >/dev/null
          done

          remote_assets="build/release-remote-assets.json"
          gh api -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" \
            >"${remote_assets}"
          python3 scripts/verify_release_assets.py verify-remote-assets \
            --response "${remote_assets}" \
            --local-directory build/release-dist

          # Draft releases and their tags remain mutable. Re-fetch immediately
          # before the visibility transition and refuse a moved tag.
          git fetch --no-tags --force origin \
            "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          test "$(git rev-list -n 1 "${RELEASE_TAG}")" = "${EXPECTED_SHA}"

          # Remove the private run marker and publish in one transition. If
          # this request partially succeeds, cleanup cannot match/delete the
          # now-public release or any independently-created draft.
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            -f "name=${release_title}" \
            -F "body=@build/release-dist/RELEASE-NOTES.md" \
            -F draft=false -F prerelease=true >/dev/null
          gh api -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            >"${published_identity}"
          python3 scripts/check_release_workflow.py verify-published \
            --response "${published_identity}" \
            --tag "${RELEASE_TAG}" \
            --title "${release_title}" \
            --notes-file build/release-dist/RELEASE-NOTES.md \
            --forbidden-marker "${draft_marker}" \
            --id "${release_id}" >/dev/null
          test "$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft)" = false
          test "$(gh release view "${RELEASE_TAG}" --json isPrerelease --jq .isPrerelease)" = true
          test "$(gh release view "${RELEASE_TAG}" --json isImmutable --jq .isImmutable)" = true
          git fetch --no-tags --force origin \
            "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          test "$(git rev-list -n 1 "${RELEASE_TAG}")" = "${EXPECTED_SHA}"
          gh release verify "${RELEASE_TAG}" --format json >/dev/null
          trap - EXIT
          rm -f "${owned_notes}" "${release_list}" "${release_identity}" \
            "${published_identity}"
