name: Bug report
description: Report a reproducible YunPin problem using synthetic data.
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach personal dictionaries, conversation exports, tokens, keys, databases, or production logs.
  - type: textarea
    id: summary
    attributes:
      label: Summary
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction with synthetic data
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
    validations:
      required: true
