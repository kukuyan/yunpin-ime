# Weasel/Windows default overlay. Copy into the user's Rime data directory.
# macOS reads platform/rime/squirrel/default.custom.yaml instead; the menu
# settings of the two files are kept in step by tools/importer tests.

patch:
  "menu/page_size": 8
  "menu/alternative_select_keys": "12345678"
  # Remember an explicit choice from the schema menu. Rime treats a missing
  # option as false, so the first-run/default state remains "拼音关".
  "switcher/save_options/@after last": yunpin_show_candidate_pinyin
