# SPDX-License-Identifier: GPL-3.0-only
# Original YunPin compact theme; contains no Sogou asset or branding.

patch:
  "style/horizontal": true
  "style/inline_preedit": true
  "style/preedit_type": composition
  "style/font_face": "Microsoft YaHei UI"
  "style/label_font_face": "Segoe UI"
  "style/comment_font_face": "Microsoft YaHei UI"
  "style/font_point": 14
  "style/label_font_point": 10
  "style/comment_font_point": 12
  "style/label_format": "%s."
  "style/mark_text": ""
  "style/color_scheme": yunpin_light
  "style/color_scheme_dark": yunpin_dark
  "style/layout/align_type": center
  "style/layout/min_width": 0
  "style/layout/max_width": 0
  "style/layout/border_width": 1
  "style/layout/margin_x": 10
  "style/layout/margin_y": 7
  "style/layout/spacing": 8
  "style/layout/candidate_spacing": 14
  "style/layout/hilite_padding": 5
  "style/layout/round_corner": 6
  "style/layout/corner_radius": 8
  "preset_color_schemes/yunpin_light":
    name: "云拼浅色 / YunPin Light"
    author: "YunPin contributors"
    back_color: 0xFFFFFF
    border_color: 0xE6E6E6
    text_color: 0x383838
    hilited_text_color: 0x383838
    hilited_back_color: 0xFFFFFF
    candidate_text_color: 0x303030
    label_color: 0x888888
    comment_text_color: 0x888888
    hilited_candidate_text_color: 0xFFFFFF
    hilited_candidate_label_color: 0xFFFFFF
    hilited_comment_text_color: 0xF5F5F5
    # Weasel uses BGR: this renders as #3478F6.
    hilited_candidate_back_color: 0xF67834
  "preset_color_schemes/yunpin_dark":
    name: "云拼深色 / YunPin Dark"
    author: "YunPin contributors"
    back_color: 0x292929
    border_color: 0x414141
    text_color: 0xF2F2F2
    hilited_text_color: 0xF2F2F2
    hilited_back_color: 0x292929
    candidate_text_color: 0xEBEBEB
    label_color: 0xA8A8A8
    comment_text_color: 0xA8A8A8
    hilited_candidate_text_color: 0xFFFFFF
    hilited_candidate_label_color: 0xFFFFFF
    hilited_comment_text_color: 0xF5F5F5
    # Weasel uses BGR: this renders as #4C8DFF.
    hilited_candidate_back_color: 0xFF8D4C
