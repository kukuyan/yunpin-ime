# SPDX-License-Identifier: GPL-3.0-only
schema:
  schema_id: yunpin_e2e
  name: YunPin merged-plugin fixture
  version: "1.0"

switches:
  - name: ascii_mode
    reset: 0
    states: [中文, ASCII]

engine:
  processors:
    - speller
    - selector
    - navigator
    - express_editor
  segmentors:
    - abc_segmentor
    - fallback_segmentor
  translators:
    - script_translator
  filters:
    - yunpin_filter@yunpin
    - uniquifier

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"

translator:
  dictionary: yunpin_e2e
  enable_user_dict: false
  enable_sentence: false

yunpin:
  tag: abc
  snapshot: yunpin/private.tsv
  max_candidates: 2
  enabled: true
