[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "yunpin-public-pack"
version = "0.1.0"
description = "Deterministic offline public dictionary builder for YunPin IME"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "YunPin contributors" }]
dependencies = []

[project.scripts]
yunpin-public-pack = "yunpin_public_pack.cli:main"

[tool.setuptools]
packages = ["yunpin_public_pack"]
