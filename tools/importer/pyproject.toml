[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "yunpin-importer"
version = "0.1.0"
description = "Offline, privacy-preserving vocabulary importer for YunPin IME"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "YunPin contributors" }]
dependencies = []

[project.scripts]
yunpin-import = "yunpin_importer.cli:main"

[tool.setuptools]
packages = ["yunpin_importer"]
